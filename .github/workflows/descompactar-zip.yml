name: Bot - Descompactar ZIP

on:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/descompactar-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descompactar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair ZIPs e organizar pastas
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          git ls-files -z '*.zip' | while IFS= read -r -d '' z; do
            echo "Extraindo $z"
            tmp=$(mktemp -d)
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmp"
            fi
            rm -rf "$src/.git" "$src/.github/workflows"
            dest="$(dirname "$z")"
            (cd "$src" && find . -mindepth 2 -type f) | while IFS= read -r f; do
              base="$(basename "$f")"
              if [ -f "$dest/$base" ] && [ ! -f "$src/$base" ]; then
                echo "Removendo copia solta: $dest/$base"
                git rm -q -f "$dest/$base"
              fi
            done
            cp -a "$src"/. "$dest"/
            git rm -q "$z"
            rm -rf "$tmp"
          done

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para commitar"
            exit 0
          fi
          git commit -m "Bot: extrai ZIP e organiza pastas"
          git push
